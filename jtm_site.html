<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Un petit message 💌</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(ellipse at top, #402047 0%, #1c1028 48%, #0d0b18 100%);
      color: #fff;
    }
    .glow {
      position: fixed; width: 340px; height: 340px; border-radius: 50%;
      background: #ff4f9a; filter: blur(110px); opacity: .18;
      top: 8%; left: 50%; transform: translateX(-50%);
      pointer-events: none; animation: pulse 4s ease-in-out infinite;
    }
    .card {
      position: relative; width: min(90vw, 520px); padding: 52px 28px 42px;
      text-align: center; border: 1px solid rgba(255,255,255,.16);
      border-radius: 28px; background: rgba(255,255,255,.07);
      box-shadow: 0 24px 80px rgba(0,0,0,.35); backdrop-filter: blur(14px);
      animation: appear .9s cubic-bezier(.2,.8,.2,1) both;
    }
    .heart { font-size: 42px; display: inline-block; animation: heartbeat 1.5s ease-in-out infinite; }
    h1 {
      margin: 18px 0 30px; font-size: clamp(2.3rem, 9vw, 4.2rem);
      letter-spacing: -.04em; line-height: 1.05;
      background: linear-gradient(100deg, #fff 15%, #ffb6d5 52%, #ff5caa 90%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: textIn 1s .15s both;
    }
    button {
      border: 0; border-radius: 999px; padding: 14px 32px;
      color: #341226; background: linear-gradient(135deg, #ffd2e5, #ff6eb0);
      font-size: 1rem; font-weight: 750; cursor: pointer;
      box-shadow: 0 8px 28px rgba(255,92,170,.25);
      transition: transform .2s, box-shadow .2s;
    }
    button:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 12px 32px rgba(255,92,170,.4); }
    button:active { transform: scale(.97); }
    .message { min-height: 1.4em; margin: 0 0 28px; font-size: clamp(1.5rem, 6vw, 2.5rem); font-weight: 750; }
    .hidden { display: none; }
    .reveal { animation: reveal .65s cubic-bezier(.2,.8,.2,1) both; }
    .sparkle { position: fixed; pointer-events: none; font-size: 20px; animation: floatUp 3.5s linear forwards; opacity: 0; }
    @keyframes appear { from { opacity: 0; transform: translateY(24px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes textIn { from { opacity: 0; transform: translateY(16px); filter: blur(8px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
    @keyframes reveal { from { opacity: 0; transform: scale(.8) rotate(-2deg); filter: blur(8px); } to { opacity: 1; transform: scale(1) rotate(0); filter: blur(0); } }
    @keyframes heartbeat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.15); } 30% { transform: scale(1); } 45% { transform: scale(1.1); } }
    @keyframes pulse { 0%, 100% { opacity: .14; transform: translateX(-50%) scale(.9); } 50% { opacity: .25; transform: translateX(-50%) scale(1.12); } }
    @keyframes floatUp { 0% { opacity: 0; transform: translateY(0) scale(.6) rotate(0); } 15% { opacity: .9; } 100% { opacity: 0; transform: translateY(-110vh) scale(1.2) rotate(35deg); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="glow"></div>
  <main class="card">
    <div class="heart" aria-hidden="true">💗</div>
    <h1 id="headline">jtm c bon</h1>
    <p id="secondMessage" class="message hidden" aria-live="polite">nan je dehek (ou pas) 😭</p>
    <button id="nextButton" type="button">suivant →</button>
  </main>
  <script>
    const button = document.getElementById('nextButton');
    const headline = document.getElementById('headline');
    const secondMessage = document.getElementById('secondMessage');
    let revealed = false;

    function makeSparkle() {
      const el = document.createElement('span');
      el.className = 'sparkle';
      el.textContent = ['💗', '✨', '💕', '♡'][Math.floor(Math.random() * 4)];
      el.style.left = (5 + Math.random() * 90) + 'vw';
      el.style.top = (65 + Math.random() * 30) + 'vh';
      el.style.animationDuration = (2.5 + Math.random() * 2) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 5000);
    }

    button.addEventListener('click', () => {
      if (!revealed) {
        revealed = true;
        headline.classList.add('hidden');
        secondMessage.classList.remove('hidden');
        secondMessage.classList.remove('reveal');
        void secondMessage.offsetWidth;
        secondMessage.classList.add('reveal');
        button.textContent = 'recommencer ↻';
        for (let i = 0; i < 18; i++) setTimeout(makeSparkle, i * 70);
      } else {
        revealed = false;
        secondMessage.classList.add('hidden');
        headline.classList.remove('hidden');
        headline.classList.remove('textIn');
        void headline.offsetWidth;
        headline.classList.add('textIn');
        button.textContent = 'suivant →';
      }
    });
  </script>
</body>
</html>
